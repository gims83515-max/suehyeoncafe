<!DOCTYPE html>
<html>
<head>
  <title>내 카페</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">☕ 내 카페</div>
</header>

<div class="container">
  <!-- 사이드바 -->
  <aside>
    <h3>📋 메뉴</h3>
    <button onclick="showFree()">자유게시판</button>
  </aside>

  <!-- 메인 -->
  <main id="content"></main>
</div>

<script>
function showFree() {
  const posts = JSON.parse(localStorage.getItem("posts") || "[]");

  let html = `
    <div class="board-header">
      <h2>자유게시판</h2>
      <button onclick="writePost()">✏️ 글쓰기</button>
    </div>
    <div class="post-list">
  `;

  posts.reverse().forEach((post, i) => {
    html += `
      <div class="post-card" onclick="viewPost(${posts.length - 1 - i})">
        ${post.image ? `<img src="${post.image}">` : ""}
        <div class="post-title">${post.title}</div>
      </div>
    `;
  });

  html += "</div>";
  document.getElementById("content").innerHTML = html;
}

function writePost() {
  document.getElementById("content").innerHTML = `
    <div class="write-box">
      <h2>글쓰기</h2>
      <input id="title" placeholder="제목">
      <textarea id="text" placeholder="내용"></textarea>
      <input type="file" id="image" onchange="previewImage(event)">
      <img id="preview">
      <button onclick="savePost()">등록</button>
    </div>
  `;
}

function previewImage(event) {
  const reader = new FileReader();
  reader.onload = function() {
    document.getElementById("preview").src = reader.result;
  };
  reader.readAsDataURL(event.target.files[0]);
}

function savePost() {
  const title = document.getElementById("title").value;
  const text = document.getElementById("text").value;
  const file = document.getElementById("image").files[0];

  const reader = new FileReader();

  reader.onload = function() {
    const image = reader.result;
    const posts = JSON.parse(localStorage.getItem("posts") || "[]");
    posts.push({ title, text, image });
    localStorage.setItem("posts", JSON.stringify(posts));
    showFree();
  };

  if (file) {
    reader.readAsDataURL(file);
  } else {
    const posts = JSON.parse(localStorage.getItem("posts") || "[]");
    posts.push({ title, text, image: "" });
    localStorage.setItem("posts", JSON.stringify(posts));
    showFree();
  }
}

function viewPost(index) {
  const posts = JSON.parse(localStorage.getItem("posts") || "[]");
  const post = posts[index];

  let html = `
    <div class="post-view">
      <h2>${post.title}</h2>
      <p>${post.text}</p>
  `;

  if (post.image) {
    html += `<img src="${post.image}" class="view-img">`;
  }

  html += `<button onclick="showFree()">← 목록</button></div>`;

  document.getElementById("content").innerHTML = html;
}

showFree();
</script>

</body>
</html>
